name: Update OpenAI Ads product feed

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests paramiko

      - name: Build feed
        id: build
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from openai_feed_sync import REMOTE_FILENAME, convert, download

          with TemporaryDirectory() as folder:
              source = Path(folder) / "idosell.xml"
              download(source)
              stats = convert(source, Path(REMOTE_FILENAME))

          if stats["written"] < 1000:
              raise SystemExit(f"Too few valid products: {stats['written']}")

          print(f"Exported {stats['written']} products")
          PY

      - name: Upload to Ads Manager
        env:
          OPENAI_SFTP_HOST: ${{ secrets.OPENAI_SFTP_HOST }}
          OPENAI_SFTP_PORT: ${{ secrets.OPENAI_SFTP_PORT }}
          OPENAI_SFTP_USERNAME: ${{ secrets.OPENAI_SFTP_USERNAME }}
          OPENAI_SFTP_PASSWORD: ${{ secrets.OPENAI_SFTP_PASSWORD }}
        run: python -c "from openai_feed_sync import REMOTE_FILENAME, upload; upload(REMOTE_FILENAME)"

      - name: Upload to Business Hub
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          OPENAI_SFTP_HOST: sftp-prod3.commerce.openai.com
          OPENAI_SFTP_PORT: "443"
          OPENAI_SFTP_USERNAME: ${{ secrets.BUSINESS_HUB_SFTP_USERNAME }}
          OPENAI_SFTP_PASSWORD: ${{ secrets.BUSINESS_HUB_SFTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os

          from openai_feed_sync import REMOTE_FILENAME, upload

          expected_username = "oaiproductfeedprod3.sftp53dffae381b64430863d66ac0472cb98"

          if os.environ["OPENAI_SFTP_USERNAME"] != expected_username:
              raise SystemExit(
                  "Login w sekrecie BUSINESS_HUB_SFTP_USERNAME nie zgadza się "
                  "z loginem nowego kanału DES."
              )

          upload(REMOTE_FILENAME)
          print(f"Wysłano plik {REMOTE_FILENAME} na konto SFTP nowego kanału DES.")
          PY
